name: training
description: "A simple Velia mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/welcome_background.png
    - assets/ring_icon.png
    - assets/charging_station.png
    - assets/ring_dock.png
    - assets/velia_ring.png
    - assets/carousel_1.png
    - assets/carousel_2.png
    - assets/carousel_3.png
    - assets/login_carousel_1.png
    - assets/login_carousel_2.png
    - assets/login_carousel_3.png

  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          weight: 300
          style: italic
